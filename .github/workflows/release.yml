name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Version is read from the `packageManager` field in package.json.
      # Do not also set `version:` here — action-setup errors if both exist.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Generated distribution artifacts (Claude Code plugin, MCP Registry
      # manifest) must match their sources before anything ships.
      - name: Distribution artifacts are in sync
        run: pnpm plugin:check && pnpm registry:check

      # Publishes @seanhogg/builderforce-memory-engine, @seanhogg/builderforce-memory, and @seanhogg/builderforce-memory-mcp.
      # pnpm resolves `workspace:^` peer/dep specifiers to real version ranges at pack time.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── MCP Registry (registry.modelcontextprotocol.io) ──────────────────
      # The registry hosts metadata only and validates that the npm package is
      # already live, so this runs AFTER the npm publish above. OIDC auth means
      # no long-lived token: the `io.github.SeanHogg/*` namespace is proven by
      # this repository's own identity.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        working-directory: packages/memory-mcp
        run: |
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish
