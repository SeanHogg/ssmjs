name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is read from the `packageManager` field in package.json.
      # Do not also set `version:` here — action-setup errors if both exist.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (core then runtime)
        run: pnpm build

      - name: Test
        run: pnpm test

      # Enforce the coverage ratchet (memory package). The floor is set in
      # packages/memory/package.json#jest.coverageThreshold and only goes up.
      - name: Coverage
        run: pnpm test:coverage

      # The Claude Code plugin under plugins/ is GENERATED from the same source
      # as the installer. Fail if the committed copy is stale, so an edit to the
      # hook script or a version bump can't ship a plugin that disagrees with it.
      - name: Claude Code plugin is in sync
        run: pnpm plugin:check

      # The MCP Registry rejects a manifest whose package version isn't on npm,
      # so server.json must move with package.json.
      - name: MCP Registry manifest is in sync
        run: pnpm registry:check
